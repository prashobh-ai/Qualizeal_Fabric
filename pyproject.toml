[project]
name = "qualizeal-knowledge-fabric"
version = "0.4.0"
description = "QualiZeal Knowledge Fabric — grounded answers with citations, deployment-portable"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "QualiZeal AI-COE" }]

# The API service runs on FastAPI + Pydantic; nothing else is a hard runtime
# dependency. Every group below is optional (section 18): missing packages
# degrade to the standard-library adapter and their tests skip rather than fail.
dependencies = [
  "fastapi[standard]>=0.115",           # MIT
  "pydantic>=2",                        # MIT
  "uvicorn>=0.30",                      # BSD-3
]

[project.optional-dependencies]
# Developer + CI extras.
dev = [
  "ruff>=0.6",                          # MIT
  "pytest>=8.0",                        # MIT
  "pytest-asyncio>=0.24",               # Apache-2.0
  "httpx>=0.27",                        # BSD-3
  "pip-audit>=2.7",                     # Apache-2.0
]

# Real conversion + embedding + tokenisation + language detection engines.
engines = [
  "docling>=2.0",                       # MIT
  "sentence-transformers>=3.0",         # Apache-2.0
  "torch>=2.2",                         # BSD-3
  "transformers>=4.44",                 # Apache-2.0
  "spacy>=3.7",                         # MIT
  "lingua-language-detector>=2.0",      # Apache-2.0
  "tiktoken>=0.7",                      # MIT
]

# Documents of every kind (T41): spreadsheets, OCR, SVG rasterising. Docling
# (Word/PDF/PowerPoint) lives in `engines`. All imports are guarded.
documents = [
  "openpyxl>=3.1",                      # MIT
  "pytesseract>=0.3",                   # Apache-2.0 (needs the tesseract binary)
  "Pillow>=10.0",                       # MIT-CMU (HPND)
  "svglib>=1.5",                        # BSD-3
  "reportlab>=4.0",                     # BSD-3
]

# Concept-graph analytics (T57): community detection over the tenant graph.
# The import is guarded; without it graph insights fall back to components.
graph = [
  "networkx>=3.0",                      # BSD-3
]

# Postgres + pgvector engines behind the same repository API. pg8000 is BSD-3.
db = [
  "pg8000>=1.31",                       # BSD-3
]

# OpenTelemetry SDK adapter behind the Telemetry protocol. All Apache-2.0.
otel = [
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "opentelemetry-semantic-conventions>=0.48b0",
  "opentelemetry-instrumentation>=0.48b0",
]

# Provider gateway. LiteLLM speaks every provider; boto3 reaches Bedrock.
providers = [
  "litellm>=1.44",                      # MIT
  "boto3>=1.34",                        # Apache-2.0
]

# Read-only, allow-listed, ACL-propagating connectors.
connectors = [
  "PyGithub>=2.3",                      # LGPL-3.0 — external-service-only usage
  "atlassian-python-api>=3.41",         # Apache-2.0
  "msal>=1.28",                         # MIT
  "google-api-python-client>=2.140",    # Apache-2.0
]

# Speech: ASR + TTS + audio io, CPU-friendly int8 defaults.
speech = [
  "faster-whisper>=1.0",                # MIT
  "soundfile>=0.12",                    # BSD-3
  "numpy>=1.26",                        # BSD-3
]

# MCP server on the Model Context Protocol Python SDK.
mcp = [
  "mcp>=1.2",                           # MIT
]

# Optional observability UIs (Langfuse, Grafana) run as services, not packages.
obs = []

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

# The consoles read their CSS/JS/HTML from real files under surfaces/assets/
# via ui_common._read_asset. hatchling ships every file under the package
# (Python and data alike), so those fragments travel in the wheel and an
# installed package serves byte-identical pages, not just the source tree.
[tool.hatch.build.targets.wheel]
packages = ["knowledge_fabric"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["static/assets/vendor", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
