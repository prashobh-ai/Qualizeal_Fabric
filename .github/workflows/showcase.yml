# F8.1 — GitHub Pages showcase workflow.
#
# Builds `dist/showcase/` on every push to main and deploys it to Pages. The
# build seeds an in-memory fabric, drives a realistic question spread, captures
# the real endpoint JSON per role into snapshot.json, and emits the actual
# product surfaces (Workspace, Admin, Curator, Sign-in, Telemetry) plus a
# landing page — all static, driven client-side by engine.js. No server, no
# keys, standard library only.
#
# One manual step for the repository owner (in the GitHub web UI):
#   Settings → Pages → Build and deployment → Source: GitHub Actions.
# Until that toggle is flipped, this workflow deploys but the branch build
# still wins.
name: showcase

on:
  push:
    branches: [main]
  workflow_dispatch:
  # T46: the ingest workflow fires this after it pushes fabric-data, so the
  # showcase rebuilds from the new facts, analysis and baked answers.
  repository_dispatch:
    types: [fabric-updated]

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # T46: the fabric-data checkout is the data root for the doctor (provider
      # status), the ledger (api_calls/) and the build (answers/, facts).
      KF_FABRIC_ROOT: ${{ github.workspace }}/fabric-data
      KF_DATA_ROOT: ${{ github.workspace }}/fabric-data/data
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # T148 — source secrets for the (optional) build-time preflight + ingest. When
      # none is set the ingest steps skip entirely and the stdlib-only demo build is
      # unchanged; when set, they fill the Repositories / Jira / Confluence tiles.
      KF_GITHUB_TOKEN: ${{ secrets.KF_GITHUB_TOKEN }}
      JIRA_URL: ${{ secrets.JIRA_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
      CONFLUENCE_URL: ${{ secrets.CONFLUENCE_URL }}
      CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
      CONFLUENCE_TOKEN: ${{ secrets.CONFLUENCE_TOKEN }}
      # T150 — the ingest SCOPE (which org / repos / projects / spaces / site to
      # pull). A source secret authenticates; these say WHAT to fetch, and without
      # them the ingest correctly skips (the token alone has no target). They come
      # from repo Variables (Settings → Secrets and variables → Actions → Variables),
      # not secrets — an org name is not a secret — and are empty by default, so the
      # stdlib-only demo build is unchanged until an org is approved and set here.
      KF_GITHUB_ORG: ${{ vars.KF_GITHUB_ORG }}
      KF_GITHUB_REPOS: ${{ vars.KF_GITHUB_REPOS }}
      JIRA_PROJECTS: ${{ vars.JIRA_PROJECTS }}
      CONFLUENCE_SPACES: ${{ vars.CONFLUENCE_SPACES }}
      KF_WEBSITE_URL: ${{ vars.KF_WEBSITE_URL }}
      # T166 — OPT-IN browser key for the live, complexity-routed Claude call. When
      # set, it is injected into the BUILT engine.js after the build (never committed);
      # the deployed Pages app then calls Claude directly. The key is visible in the
      # served JS, so set a LOW spend cap on it in the Console and rotate it. Unset →
      # the extractive core answers and the demo is unchanged.
      ANTHROPIC_BROWSER_KEY: ${{ secrets.ANTHROPIC_BROWSER_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check out fabric-data into fabric-data/ (read-only here)
        run: python -m knowledge_fabric.fabric_data_git checkout --root fabric-data

      - name: Provider check — pin the models and prove the key (T35)
        # Exits 2..6 with the exact cause (empty secret, key rejected, model
        # outside the allowed set, Sonnet 4.6 unavailable, ping failed) and
        # writes data/provider_status.json + the provider line to the summary.
        #
        # NON-FATAL here on purpose: the public showcase is a static, model-free
        # artifact — every answer is pre-baked into snapshot.json and the browser
        # engine never calls a model — so a rejected/expired key must NOT take the
        # Pages demo offline. The model-dependent workflows (ingest.yml,
        # quality.yml) keep the HARD gate; this one records the result and
        # continues. When the key is valid the provider line + ledger still prove
        # it; when it is not, the next step bakes from fabric-data extractively.
        id: provider
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/doctor.py --require anthropic

      - name: Choose the build model mode from the provider check
        id: mode
        run: |
          if [ "${{ steps.provider.outcome }}" = "success" ]; then
            echo "kf_model_mode=anthropic" >> "$GITHUB_OUTPUT"
            echo "Provider verified — baking the showcase with the real model." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "kf_model_mode=extractive" >> "$GITHUB_OUTPUT"
            {
              echo "::warning::Provider check failed (see the 'Provider check' step log — e.g. 401 key rejected). Building the showcase from the already-baked fabric-data with the extractive engine so the demo stays live. Rotate ANTHROPIC_API_KEY in Actions → Secrets to bake with the real model and prove consumption."
              echo "⚠️ Provider check failed — showcase built extractively from baked data so the demo stays live. Rotate \`ANTHROPIC_API_KEY\` in Actions → Secrets to restore real-model baking."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # T148 — build-time source preflight + ingest. Both are SECRET-GATED (they run
      # only when a source secret is present) and NON-FATAL, so with no secrets the
      # fast, stdlib-only demo build is unchanged and always ships. When a secret is
      # set, preflight_sources writes data/preflight.json (surfaced onto the Admin
      # Sources cards) and ingest fills the Repositories / Jira / Confluence facts.
      # A 403 (GitHub org not approved) is recorded on the card — an org-admin action,
      # not a code one — and never fails the deploy.
      - name: Preflight the live sources (T124a)
        id: preflight
        if: env.KF_GITHUB_TOKEN != '' || env.JIRA_URL != '' || env.CONFLUENCE_URL != ''
        continue-on-error: true
        run: |
          python -m pip install -e ".[connectors]" >/dev/null 2>&1 || python -m pip install -e . >/dev/null 2>&1 || true
          python scripts/preflight_sources.py
      - name: Ingest the live sources for the showcase (T121)
        if: env.KF_GITHUB_TOKEN != '' || env.JIRA_URL != '' || env.CONFLUENCE_URL != ''
        continue-on-error: true
        run: |
          python -m pip install -e ".[connectors,documents]" >/dev/null 2>&1 || python -m pip install -e . >/dev/null 2>&1 || true
          python scripts/ingest.py --all || true

      - name: Build the interactive showcase (seed + bake + emit surfaces)
        # Model mode is chosen by the provider check above: the real model when
        # the key is valid (answers baked live, ledger proves the call count),
        # else the extractive engine over the already-baked fabric-data so the
        # static demo always ships. fabric-data/answers/*.json (T44 bake + T45
        # queue) ship under dist/showcase/answers/ for the baked-answer pass-through.
        env:
          KF_MODEL_MODE: ${{ steps.mode.outputs.kf_model_mode }}
          KF_LEDGER_PURPOSE: answer_bake
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/build_showcase.py --out dist/showcase

      - name: Inject the browser Anthropic key into the built engine (T166)
        # OPT-IN + NON-FATAL. Replaces the placeholder in the BUILT engine.js so the
        # deployed app calls Claude directly. Only ever touches the ephemeral build
        # artifact — the key is never committed. Skipped when the secret is unset, so
        # the keyless extractive demo is unchanged. NB: the key is public in the served
        # JS — keep a LOW spend cap on it in the Console and rotate.
        if: env.ANTHROPIC_BROWSER_KEY != ''
        run: |
          python - <<'PY'
          import os, pathlib
          p = pathlib.Path("dist/showcase/engine.js")
          s = p.read_text(encoding="utf-8")
          n = s.count("__ANTHROPIC_BROWSER_KEY__")
          p.write_text(s.replace("__ANTHROPIC_BROWSER_KEY__", os.environ["ANTHROPIC_BROWSER_KEY"]), encoding="utf-8")
          print(f"Injected browser key into engine.js ({n} placeholder occurrence(s)).")
          PY

      - name: Verify no external URLs and required data files present
        run: python scripts/verify_showcase.py --dir dist/showcase

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/showcase

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
