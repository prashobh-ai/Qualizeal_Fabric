# F8.1 — GitHub Pages showcase workflow.
#
# Builds `dist/showcase/` on every push to main and deploys it to Pages. The
# build seeds an in-memory fabric, drives a realistic question spread, captures
# the real endpoint JSON per role into snapshot.json, and emits the actual
# product surfaces (Workspace, Admin, Curator, Sign-in, Telemetry) plus a
# landing page — all static, driven client-side by engine.js. No server, no
# keys, standard library only.
#
# One manual step for the repository owner (in the GitHub web UI):
#   Settings → Pages → Build and deployment → Source: GitHub Actions.
# Until that toggle is flipped, this workflow deploys but the branch build
# still wins.
name: showcase

on:
  push:
    branches: [main]
  workflow_dispatch:
  # T46: the ingest workflow fires this after it pushes fabric-data, so the
  # showcase rebuilds from the new facts, analysis and baked answers.
  repository_dispatch:
    types: [fabric-updated]

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # T46: the fabric-data checkout is the data root for the doctor (provider
      # status), the ledger (api_calls/) and the build (answers/, facts).
      KF_FABRIC_ROOT: ${{ github.workspace }}/fabric-data
      KF_DATA_ROOT: ${{ github.workspace }}/fabric-data/data
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check out fabric-data into fabric-data/ (read-only here)
        run: python -m knowledge_fabric.fabric_data_git checkout --root fabric-data

      - name: Provider check — pin the models and prove the key (T35)
        # Exits 2..6 with the exact cause (empty secret, key rejected, model
        # outside the allowed set, Sonnet 4.6 unavailable, ping failed) and
        # writes data/provider_status.json + the provider line to the summary.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/doctor.py --require anthropic

      - name: Build the interactive showcase (seed + bake + emit surfaces)
        # Answers are baked with the REAL model under KF_MODEL_MODE=anthropic.
        # There is no fallback: a provider error stops the build with the
        # response body in the log, and a run that made zero API calls exits 7.
        # The ledger line (calls · tokens · cost · model) lands in the summary.
        # fabric-data/answers/*.json (T44 bake + T45 queue) ship under
        # dist/showcase/answers/ for the engine's baked-answer pass-through.
        env:
          KF_MODEL_MODE: anthropic
          KF_LEDGER_PURPOSE: answer_bake
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/build_showcase.py --out dist/showcase

      - name: Verify no external URLs and required data files present
        run: python scripts/verify_showcase.py --dir dist/showcase

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/showcase

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
