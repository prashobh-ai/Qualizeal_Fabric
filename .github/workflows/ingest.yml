# T46 — scheduled ingest into the fabric-data branch.
#
# Every six hours (and on demand): check out main and the fabric-data branch,
# prove the provider key, run every source + analysis + the coverage bake
# (T44), commit and push fabric-data with [skip ci], then fire the
# `fabric-updated` repository_dispatch so the showcase rebuilds from the new
# data. Steps whose module is not present are reported as skipped, never
# silently passed.
name: ingest

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Bake at most N changed documents (empty = all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      KF_MODEL_MODE: anthropic
      KF_FABRIC_ROOT: ${{ github.workspace }}/fabric-data
      KF_DATA_ROOT: ${{ github.workspace }}/fabric-data/data
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # T124 — the live-source secrets and the scope ids the connectors read.
      # Without these in the job env the connectors never see the tokens, so the
      # sources silently produce nothing; the preflight step below fails loudly
      # per source if any is wrong before an ingest is spent.
      KF_GITHUB_TOKEN: ${{ secrets.KF_GITHUB_TOKEN }}
      GITHUB_ORG: Qualizeal
      JIRA_URL: ${{ secrets.JIRA_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
      JIRA_PROJECTS: V1
      JIRA_DASHBOARDS: "10001"
      JIRA_BOARDS: "34"
      CONFLUENCE_URL: ${{ secrets.CONFLUENCE_URL }}
      CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
      CONFLUENCE_TOKEN: ${{ secrets.CONFLUENCE_TOKEN }}
      CONFLUENCE_PAGES: "1703938"
      KF_WEBSITE_URL: https://qualizeal.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check out fabric-data (clone, or create the orphan branch)
        run: python -m knowledge_fabric.fabric_data_git checkout --root fabric-data

      - name: Provider check — pin the models and prove the key (T35)
        run: python scripts/doctor.py --require anthropic

      - name: Preflight — prove each source's credential against a live call (T124)
        # One authenticated call per source; a set-but-failing secret stops the
        # build here with the exact reason (401/403/404/network), so a bad token
        # never surfaces as an empty tile in front of leadership.
        run: python scripts/preflight_sources.py

      - name: Ingest every source, analyse, bake (T44/T46)
        run: >
          python scripts/ingest.py --website --github --jira --confluence --files --analysis --bake
          ${{ github.event.inputs.limit && format('--limit {0}', github.event.inputs.limit) || '' }}

      - name: Post-ingest assertion — each source produced real documents (T124b)
        # Fails the build if a source whose preflight passed produced 0
        # documents (connector bug, named as such — not a credential fault).
        run: python scripts/verify_showcase.py --fabric

      - name: Smoke demo — one cited answer per source (T124c)
        run: python scripts/smoke_demo.py

      - name: Commit and push fabric-data
        run: >
          python -m knowledge_fabric.fabric_data_git push --root fabric-data
          -m "ingest: run ${{ github.run_id }}"

      - name: Rebuild the showcase from the new data (repository_dispatch fabric-updated)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh api repos/${{ github.repository }}/dispatches
          -f event_type=fabric-updated
          -F 'client_payload[run_id]=${{ github.run_id }}'
