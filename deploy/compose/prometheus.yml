# Prometheus scrape config for the 'full' profile. Reads the OTLP collector's
# Prometheus-exporter endpoint and the fabric container's /metrics.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:9464"]
  - job_name: fabric
    static_configs:
      - targets: ["fabric:8080"]
    metrics_path: /metrics
