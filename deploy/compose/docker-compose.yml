# Local deployment shape — Build Plan Section 17.
#
# Two profiles behind the SAME adapter contracts (ADR-0001):
#
#   PROFILE=lite (default): stdlib-only. Just the fabric container. Every
#   real engine is disabled; the platform runs against SQLite, filesystem
#   object store, in-process queue, deterministic hash embedder, mock model,
#   HS256 local IdP. This is what CI runs and what a laptop demo uses.
#
#   PROFILE=full: engine-backed. Postgres 16 + pgvector + pg_trgm, an
#   OpenTelemetry Collector, Jaeger for traces, and Prometheus for metrics.
#   Selected by env — code is unchanged. The image is the SAME image.
#
# Usage:
#   docker compose --profile lite up -d
#   docker compose --profile full up -d
services:
  fabric:
    profiles: ["lite", "full"]
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
      args:
        # Cloud-capable image built from the same Dockerfile. For 'full' we
        # pull the DB driver and OTel client; both permissive-licensed.
        KF_EXTRAS: ${KF_EXTRAS:-}
    image: qualizeal/knowledge-fabric:${KF_PROFILE:-lite}
    environment:
      - KF_PROFILE=${KF_PROFILE:-lite}
      - KF_DB=/data/kf.db
      - KF_BLOBS=/data/blobs
      - KF_MODEL_MODE=${KF_MODEL_MODE:-mock}
      - KF_MODEL_BASE_URL=${KF_MODEL_BASE_URL:-}
      - KF_MODEL_API_KEY=${KF_MODEL_API_KEY:-}
      - KF_IDP_SECRET=${KF_IDP_SECRET:-local-dev-secret-change-me}
      - KF_GROUNDING_THRESHOLD=${KF_GROUNDING_THRESHOLD:-0.50}
      # 'full' overrides — same container, different adapters selected by env.
      - KF_DB_URL=${KF_DB_URL:-}
      - KF_OTLP_URL=${KF_OTLP_URL:-}
    ports:
      - "8080:8080"
    volumes:
      - fabric-data:/data

  # --- FULL profile: real engines behind the same contracts -----------------
  postgres:
    profiles: ["full"]
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_PASSWORD=fabric
      - POSTGRES_DB=fabric
      - POSTGRES_USER=fabric
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
    ports: ["5432:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data

  # Vendor-neutral, Apache-2.0. Fabric sends OTLP/JSON here; the collector
  # fans out to Jaeger (traces) and Prometheus (metrics).
  otel-collector:
    profiles: ["full"]
    image: otel/opentelemetry-collector-contrib:0.108.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4318:4318"  # OTLP/HTTP

  jaeger:
    profiles: ["full"]
    image: jaegertracing/all-in-one:1.60
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"  # UI

  prometheus:
    profiles: ["full", "obs"]
    image: prom/prometheus:v2.54.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  # --- OBS profile (T96): optional external observability, fed by the SAME OTel
  # pipeline. Grafana reads the Prometheus metrics + Jaeger traces the collector
  # already exports; Langfuse ingests the OTLP spans for LLM-trace analytics. The
  # built-in Admin -> Observability page needs none of this — it reads the spine
  # directly — so `obs` is purely additive. Run: make compose-up PROFILE=obs
  #   (bring `full` up too for the collector/jaeger/prometheus it feeds from).
  grafana:
    profiles: ["obs"]
    image: grafana/grafana:11.2.0
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ALLOW_EMBEDDING=true
    ports:
      - "3000:3000"  # Grafana UI (Prometheus + Jaeger datasources)

  langfuse:
    profiles: ["obs"]
    image: langfuse/langfuse:2
    environment:
      # LLM-trace analytics over the same OTLP spans; secrets are dev-only here.
      - DATABASE_URL=${LANGFUSE_DB_URL:-postgresql://fabric:fabric@postgres:5432/fabric}
      - NEXTAUTH_SECRET=${LANGFUSE_SECRET:-local-dev-secret-change-me}
      - NEXTAUTH_URL=${LANGFUSE_URL:-http://localhost:3001}
      - SALT=${LANGFUSE_SALT:-local-dev-salt-change-me}
    ports:
      - "3001:3000"  # Langfuse UI

volumes:
  fabric-data:
  pg-data:
