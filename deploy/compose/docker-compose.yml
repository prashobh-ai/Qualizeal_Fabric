# Local (developer) deployment shape — Build Plan Section 17.
#
# The Knowledge Fabric app runs with LOCAL adapters (SQLite store, filesystem
# object store, in-process durable queue, deterministic embedder, mock/hosted
# model via env, local HS256 IdP). It needs no other container to run.
#
# The commented services below are the CLOUD adapters the same image points at
# via env when you move to the interim host or a client account — swapping them
# in is a configuration change, not a code change (I: portability).
services:
  fabric:
    build:
      context: ..
      dockerfile: Dockerfile
    image: qualizeal/knowledge-fabric:local
    environment:
      - KF_DB=/data/kf.db
      - KF_BLOBS=/data/blobs
      - KF_MODEL_MODE=${KF_MODEL_MODE:-mock}   # mock | hosted | off
      - KF_MODEL_BASE_URL=${KF_MODEL_BASE_URL:-}
      - KF_MODEL_API_KEY=${KF_MODEL_API_KEY:-}
      - KF_IDP_SECRET=${KF_IDP_SECRET:-local-dev-secret-change-me}
      - KF_GROUNDING_THRESHOLD=${KF_GROUNDING_THRESHOLD:-0.50}
    ports:
      - "8080:8080"
    volumes:
      - fabric-data:/data

  # --- CLOUD ADAPTERS (enable when moving to interim/client) ----------------
  # postgres:            # VectorIndex/LexicalIndex/GraphStore + Queue back-end
  #   image: pgvector/pgvector:pg16
  #   environment: { POSTGRES_PASSWORD: fabric }
  #   ports: ["5432:5432"]
  # minio:               # ObjectStore (S3-class)
  #   image: minio/minio
  #   command: server /data --console-address ":9001"
  #   ports: ["9000:9000", "9001:9001"]
  # keycloak:            # OIDC IdP (Runbook Section 0) — Principal adapter swap
  #   image: quay.io/keycloak/keycloak:24.0
  #   command: start-dev
  #   ports: ["8081:8080"]

volumes:
  fabric-data:
