# OpenTelemetry Collector (Apache-2.0) — the 'full' profile's telemetry hub.
# Receives OTLP/JSON from the fabric container and fans out to Jaeger for
# traces and Prometheus for metrics. Vendor-neutral by design.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:9464

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
